---
name: Lint Shell scripts on Pull Requests

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "**.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Get changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          list-files: shell
          filters: |
            shell:
              - added|modified: "**.sh"
      - name: Lint files
        if: ${{ steps.filter.outputs.shell == 'true' }}
        uses: reviewdog/action-shellcheck@b4ffc0b2a69f857f82b74d1310cd3e62e932f9f7 # v1
        with:
          shellcheck_flags: "${{ steps.filter.outputs.shell_files }}"
