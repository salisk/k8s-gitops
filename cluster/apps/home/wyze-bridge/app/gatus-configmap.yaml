---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${APP}-gatus-ep"
  namespace: home
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: "${APP}"
        group: internal
        url: "https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover
