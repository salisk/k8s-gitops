---
apiVersion: v1
kind: Secret
metadata:
  name: excalidash-secret
  namespace: productivity
type: Opaque
stringData:
  # Postgres Init (creates database and user)
  INIT_POSTGRES_DBNAME: excalidash
  INIT_POSTGRES_HOST: postgres-rw.data.svc.cluster.local
  INIT_POSTGRES_USER: excalidash
  INIT_POSTGRES_PASS: "${EXCALIDASH_POSTGRES_PASSWORD}"
  INIT_POSTGRES_SUPER_PASS: "${POSTGRES_SUPER_PASS}"

  # Database Connection
  DATABASE_URL: "postgresql://excalidash:${EXCALIDASH_POSTGRES_PASSWORD}@postgres-rw.data.svc.cluster.local:5432/excalidash"

  # Application Secrets
  JWT_SECRET: "${EXCALIDASH_JWT_SECRET}"
  CSRF_SECRET: "${EXCALIDASH_CSRF_SECRET}"

  # OIDC Authentication (Authentik)
  OIDC_CLIENT_ID: "${EXCALIDASH_OIDC_CLIENT_ID}"
  OIDC_CLIENT_SECRET: "${EXCALIDASH_OIDC_CLIENT_SECRET}"
