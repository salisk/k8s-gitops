---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app excalidash
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      excalidash:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
              pullPolicy: IfNotPresent
            envFrom: &envFrom
              - secretRef:
                  name: excalidash-secret
        pod:
          enableServiceLinks: false
        containers:
          backend:
            image:
              repository: zimengxiong/excalidash-backend
              tag: 0.6.0@sha256:cbdab75f31b21e342b464d6404a454791e5da7452e3614b137021a800fc4cac6
            env:
              DATABASE_PROVIDER: postgresql
              PORT: &backendPort 8000
              NODE_ENV: production
              FRONTEND_URL: https://draw.${SECRET_DOMAIN}
              TRUST_PROXY: "1"
              ENFORCE_HTTPS_REDIRECT: "false"
              AUTH_MODE: oidc_enforced
              OIDC_PROVIDER_NAME: Authentik
              OIDC_ISSUER_URL: https://sso.${SECRET_DOMAIN}/application/o/excalidash/
              OIDC_REDIRECT_URI: https://draw.${SECRET_DOMAIN}/api/auth/oidc/callback
              OIDC_SCOPES: openid profile email
              OIDC_GROUPS_CLAIM: groups
              OIDC_ADMIN_GROUPS: admins
              OIDC_REQUIRE_EMAIL_VERIFIED: "false"
              UPDATE_CHECK_OUTBOUND: "false"
            envFrom: *envFrom
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *backendPort
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 10
                  failureThreshold: 30
              liveness: &probes-backend
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *backendPort
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes-backend
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
          frontend:
            image:
              repository: zimengxiong/excalidash-frontend
              tag: 0.6.0@sha256:4ec5b20c03034b96d37cfb87b5c39e9cc5958441a3abd8dcc413d11dfb11809c
            env:
              BACKEND_URL: localhost:8000
            probes:
              liveness: &probes-frontend
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &frontendPort 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes-frontend
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *frontendPort
    route:
      app:
        hostnames:
          - draw.${SECRET_DOMAIN}
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
