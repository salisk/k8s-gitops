---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/secret.json
apiVersion: v1
kind: Secret
metadata:
  name: mail-archiver-secret
  namespace: productivity
type: Opaque
stringData:
  # Postgres Init (creates database and user)
  INIT_POSTGRES_DBNAME: mailarchiver
  INIT_POSTGRES_HOST: postgres-rw.data.svc.cluster.local
  INIT_POSTGRES_USER: mailarchiver
  INIT_POSTGRES_PASS: "${MAIL_ARCHIVER_POSTGRES_PASSWORD}"
  INIT_POSTGRES_SUPER_PASS: "${POSTGRES_SUPER_PASS}"

  # Database Connection
  ConnectionStrings__DefaultConnection: "Host=postgres-rw.data.svc.cluster.local;Database=mailarchiver;Username=mailarchiver;Password=${MAIL_ARCHIVER_POSTGRES_PASSWORD};"

  # Admin Authentication (fallback if OIDC is unavailable)
  Authentication__Username: "${ADVENTURELOG_ADMIN_USERNAME}"
  Authentication__Password: "${ADVENTURELOG_ADMIN_PASSWORD}"

  # OIDC Authentication (Authentik)
  OAuth__Enabled: "true"
  OAuth__Authority: "https://sso.${SECRET_DOMAIN}/application/o/mail-archiver/"
  OAuth__ClientId: "${MAIL_ARCHIVER_OIDC_CLIENT_ID}"
  OAuth__ClientSecret: "${MAIL_ARCHIVER_OIDC_CLIENT_SECRET}"
  OAuth__DisplayName: "SSO"
  OAuth__ClientScopes__0: "openid"
  OAuth__ClientScopes__1: "profile"
  OAuth__ClientScopes__2: "email"
  OAuth__DisablePasswordLogin: "true"
  OAuth__AutoRedirect: "true"
  OAuth__AutoApproveUsers: "true"
  OAuth__AdminEmails__0: "${ADVENTURELOG_ADMIN_EMAIL}"
