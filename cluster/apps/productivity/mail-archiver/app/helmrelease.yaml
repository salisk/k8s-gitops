---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mail-archiver
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      mail-archiver:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
              pullPolicy: IfNotPresent
            envFrom: &envFrom
              - secretRef:
                  name: mail-archiver-secret
        containers:
          app:
            image:
              repository: docker.io/s1t5/mailarchiver
              tag: 2607.5@sha256:296af6847dc1be84f50b167f1cbf45b1df876098d72f4fe825bb2179be077a13
            env:
              TZ: "${TIMEZONE}"
              TimeZone__DisplayTimeZoneId: "${TIMEZONE}"
              AllowedHosts: "mail.${SECRET_DOMAIN}"
              # Auth
              Authentication__SessionTimeoutMinutes: "60"
              Authentication__CookieName: MailArchiverAuth
              Authentication__CookieSameSite: Lax
              # Append-only archive: lock all deletion
              DeletionPolicy__DeletionAllowed: "false"
              # Mail Sync
              MailSync__IntervalMinutes: "15"
              MailSync__TimeoutMinutes: "60"
              MailSync__ConnectionTimeoutSeconds: "180"
              MailSync__CommandTimeoutSeconds: "300"
              MailSync__AlwaysForceFullSync: "false"
              MailSync__IgnoreSelfSignedCert: "false"
              # Upload
              Upload__MaxFileSizeGB: "10"
              Upload__KeepAliveTimeoutHours: "4"
              Upload__RequestHeadersTimeoutHours: "2"
              # Database Maintenance
              DatabaseMaintenance__Enabled: "true"
              DatabaseMaintenance__DailyExecutionTime: "02:00"
              DatabaseMaintenance__TimeoutMinutes: "30"
              # Npgsql
              Npgsql__CommandTimeout: "900"
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 5000
                    httpHeaders:
                      - name: Host
                        value: mail.${SECRET_DOMAIN}
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: mail.${SECRET_DOMAIN}
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: mail-archiver
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "email-multiple-outline"
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Productivity
          gethomepage.dev/name: Mail Archiver
          gethomepage.dev/description: Email Archiving
          gethomepage.dev/icon: mailarchiver.png
        hostnames:
          - "mail.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: mail-archiver-app
                port: *port
    persistence:
      data-protection-keys:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 100Mi
        globalMounts:
          - path: /app/DataProtection-Keys
