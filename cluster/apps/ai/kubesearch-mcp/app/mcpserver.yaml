---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch-mcp
spec:
  groupRef:
    name: mcp-tools
  image: ghcr.io/perfectra1n/kubesearch-mcp:1.0.1@sha256:a8e2129500321b491893e08700d6f87fe8f9078efbea546e0ba8d5183c127df1
  transport: streamable-http
  mcpPort: 3000
  podTemplateSpec:
    spec:
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
