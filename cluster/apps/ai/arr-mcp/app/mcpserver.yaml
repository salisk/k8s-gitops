---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: arr-mcp
spec:
  groupRef:
    name: mcp-tools
  image: ghcr.io/aplaceforallmystuff/mcp-arr:1.7.4@sha256:b64eb8fe294b95bf363cd00bb9e14d7ff81d2953b521eda0d49d6a056a17369e
  transport: stdio
  proxyMode: streamable-http
  env:
    - name: SONARR_URL
      value: http://sonarr.media.svc.cluster.local
    - name: RADARR_URL
      value: http://radarr.media.svc.cluster.local
  secrets:
    - name: arr-mcp-secret
      key: SONARR_API_KEY
      targetEnvName: SONARR_API_KEY
    - name: arr-mcp-secret
      key: RADARR_API_KEY
      targetEnvName: RADARR_API_KEY
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
