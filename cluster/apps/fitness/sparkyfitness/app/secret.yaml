---
apiVersion: v1
kind: Secret
metadata:
  name: sparkyfitness-secret
  namespace: fitness
type: Opaque
stringData:
  # Postgres Init (creates database and user)
  INIT_POSTGRES_DBNAME: sparkyfitness
  INIT_POSTGRES_HOST: postgres-rw.data.svc.cluster.local
  INIT_POSTGRES_USER: sparkyfitness
  INIT_POSTGRES_PASS: "${SPARKY_FITNESS_POSTGRES_PASS}"
  INIT_POSTGRES_SUPER_PASS: "${POSTGRES_SUPER_PASS}"

  # Application Secrets
  SPARKY_FITNESS_API_ENCRYPTION_KEY: "${SPARKY_FITNESS_API_ENCRYPTION_KEY}"
  BETTER_AUTH_SECRET: "${SPARKY_FITNESS_BETTER_AUTH_SECRET}"

  # OIDC (Authentik)
  SPARKY_FITNESS_OIDC_CLIENT_ID: "${SPARKY_FITNESS_OIDC_CLIENT_ID}"
  SPARKY_FITNESS_OIDC_CLIENT_SECRET: "${SPARKY_FITNESS_OIDC_CLIENT_SECRET}"
