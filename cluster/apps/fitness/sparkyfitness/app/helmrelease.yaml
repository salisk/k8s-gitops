---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sparkyfitness
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
              pullPolicy: IfNotPresent
            envFrom: &envFrom
              - secretRef:
                  name: sparkyfitness-secret
        pod:
          enableServiceLinks: false
        containers:
          app:
            image:
              repository: docker.io/codewithcj/sparkyfitness_server
              tag: v1.6.1@sha256:d37fcac4d0d44c212b9bfacabaf53f502adda7c9a28a2c4941c066df7a0778e7
            env:
              TZ: ${TIMEZONE}
              NODE_ENV: production
              SPARKY_FITNESS_FRONTEND_URL: https://fitness.${SECRET_DOMAIN}
              SPARKY_FITNESS_DISABLE_SIGNUP: "false"
              SPARKY_FITNESS_LOG_LEVEL: info
              SPARKY_FITNESS_DB_HOST:
                valueFrom: &dbHost
                  secretKeyRef:
                    name: sparkyfitness-secret
                    key: INIT_POSTGRES_HOST
              SPARKY_FITNESS_DB_PORT:
                value: "5432"
              SPARKY_FITNESS_DB_NAME:
                valueFrom: &dbName
                  secretKeyRef:
                    name: sparkyfitness-secret
                    key: INIT_POSTGRES_DBNAME
              SPARKY_FITNESS_DB_USER:
                valueFrom: &dbUser
                  secretKeyRef:
                    name: sparkyfitness-secret
                    key: INIT_POSTGRES_USER
              SPARKY_FITNESS_DB_PASSWORD:
                valueFrom: &dbPass
                  secretKeyRef:
                    name: sparkyfitness-secret
                    key: INIT_POSTGRES_PASS
              SPARKY_FITNESS_APP_DB_USER: *dbUser
              SPARKY_FITNESS_APP_DB_PASSWORD: *dbPass
              SPARKY_FITNESS_API_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-secret
                    key: SPARKY_FITNESS_API_ENCRYPTION_KEY
              BETTER_AUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-secret
                    key: BETTER_AUTH_SECRET
              # OIDC (Authentik)
              SPARKY_FITNESS_OIDC_AUTH_ENABLED: "true"
              SPARKY_FITNESS_OIDC_PROVIDER_SLUG: authentik
              SPARKY_FITNESS_OIDC_PROVIDER_NAME: Authentik
              SPARKY_FITNESS_OIDC_ISSUER_URL: https://sso.${SECRET_DOMAIN}/application/o/sparkyfitness/
              SPARKY_FITNESS_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-secret
                    key: SPARKY_FITNESS_OIDC_CLIENT_ID
              SPARKY_FITNESS_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-secret
                    key: SPARKY_FITNESS_OIDC_CLIENT_SECRET
              SPARKY_FITNESS_OIDC_AUTO_REGISTER: "true"
              SPARKY_FITNESS_OIDC_AUTO_REDIRECT: "true"
              SPARKY_FITNESS_OIDC_ADMIN_GROUP: admins
              SPARKY_FITNESS_DISABLE_EMAIL_LOGIN: "true"
            envFrom: *envFrom
            probes:
              liveness: &probes-server
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &serverPort 3010
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes-server
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *serverPort
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      frontend:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
        containers:
          app:
            image:
              repository: docker.io/codewithcj/sparkyfitness
              tag: v1.6.1@sha256:092090994d27c968d4d5ea7808f8d566aa9c323508b564f0bd4762720b358979
            env:
              SPARKY_FITNESS_FRONTEND_URL: https://fitness.${SECRET_DOMAIN}
              SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
              SPARKY_FITNESS_SERVER_PORT: "3010"
            probes:
              liveness: &probes-frontend
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &frontendPort 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes-frontend
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      server:
        controller: server
        ports:
          http:
            port: *serverPort
      frontend:
        controller: frontend
        ports:
          http:
            port: *frontendPort
    route:
      app:
        hostnames:
          - fitness.${SECRET_DOMAIN}
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: frontend
                port: http
    persistence:
      uploads:
        existingClaim: ${APP}
        advancedMounts:
          server:
            app:
              - subPath: uploads
                path: /app/SparkyFitnessServer/uploads
      backup:
        existingClaim: ${APP}
        advancedMounts:
          server:
            app:
              - subPath: backup
                path: /app/SparkyFitnessServer/backup
