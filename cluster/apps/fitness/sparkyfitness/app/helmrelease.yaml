---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sparkyfitness
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
              pullPolicy: IfNotPresent
            envFrom: &envFrom
              - secretRef:
                  name: sparkyfitness-secret
        pod:
          enableServiceLinks: false
        containers:
          app:
            image:
              repository: docker.io/codewithcj/sparkyfitness_server
              tag: v1.7.1@sha256:dd340607b2748941032a5c0db679363eb736ad810e26df10d93810a2b1518d5e
            env:
              TZ: ${TIMEZONE}
              NODE_ENV: production
              SPARKY_FITNESS_FRONTEND_URL: https://fitness.${SECRET_DOMAIN}
              SPARKY_FITNESS_DISABLE_SIGNUP: "false"
              SPARKY_FITNESS_LOG_LEVEL: info
              SPARKY_FITNESS_DB_PORT: "5432"
              # OIDC (Authentik)
              SPARKY_FITNESS_OIDC_AUTH_ENABLED: "true"
              SPARKY_FITNESS_OIDC_PROVIDER_SLUG: authentik
              SPARKY_FITNESS_OIDC_PROVIDER_NAME: Authentik
              SPARKY_FITNESS_OIDC_ISSUER_URL: https://sso.${SECRET_DOMAIN}/application/o/sparkyfitness/
              SPARKY_FITNESS_OIDC_AUTO_REGISTER: "true"
              SPARKY_FITNESS_OIDC_AUTO_REDIRECT: "true"
              SPARKY_FITNESS_OIDC_ADMIN_GROUP: admins
              SPARKY_FITNESS_DISABLE_EMAIL_LOGIN: "true"
              # Garmin
              GARMIN_MICROSERVICE_URL: http://sparkyfitness-garmin:8000
            envFrom: *envFrom
            probes:
              liveness: &probes-server
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &serverPort 3010
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes-server
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *serverPort
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      frontend:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
        containers:
          app:
            image:
              repository: docker.io/codewithcj/sparkyfitness
              tag: v1.7.1@sha256:4dd132cf1db66d6c4f4669bd04d9558ffe5006e40e8b7ee33c0859d52d9de379
            env:
              SPARKY_FITNESS_FRONTEND_URL: https://fitness.${SECRET_DOMAIN}
              SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
              SPARKY_FITNESS_SERVER_PORT: "3010"
            probes:
              liveness: &probes-frontend
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &frontendPort 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes-frontend
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
      garmin:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
        containers:
          app:
            image:
              repository: docker.io/codewithcj/sparkyfitness_garmin
              tag: v1.7.1@sha256:6ed61b7623e3c4f928f1c302cf0a1b128f2e62633c09f47414d2f69f6d14a523
            env:
              TZ: ${TIMEZONE}
              GARMIN_SERVICE_PORT: "8000"
              GARMIN_MICROSERVICE_URL: http://sparkyfitness-garmin:8000
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      server:
        controller: server
        ports:
          http:
            port: *serverPort
      frontend:
        controller: frontend
        ports:
          http:
            port: *frontendPort
      garmin:
        controller: garmin
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames:
          - fitness.${SECRET_DOMAIN}
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: frontend
                port: http
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        advancedMounts:
          server:
            app:
              - subPath: uploads
                path: /app/SparkyFitnessServer/uploads
              - subPath: backup
                path: /app/SparkyFitnessServer/backup
