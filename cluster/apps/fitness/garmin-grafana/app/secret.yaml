---
apiVersion: v1
kind: Secret
metadata:
  name: &secret garmin-grafana-secret
  namespace: fitness
type: Opaque
stringData:
  # InfluxDB v2 v1-compat API: username is arbitrary, password is the API token
  INFLUXDB_USERNAME: admin
  INFLUXDB_PASSWORD: "${GARMIN_INFLUXDB_TOKEN}"
  # Garmin Connect credentials (optional - if not set, interactive login on first run)
  GARMINCONNECT_EMAIL: "${GARMINCONNECT_EMAIL}"
  GARMINCONNECT_BASE64_PASSWORD: "${GARMINCONNECT_BASE64_PASSWORD}"
