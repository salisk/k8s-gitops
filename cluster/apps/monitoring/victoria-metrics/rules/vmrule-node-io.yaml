---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: node-io-pressure
  namespace: monitoring
spec:
  groups:
    - name: node.io.pressure
      rules:
        # PSI io "some" — fraction of time at least one task is blocked on IO.
        # Sustained high values mean workloads on this node are spending significant
        # wall-clock time waiting for storage. This is the early-warning signal.
        - alert: NodeIOPressureWaiting
          expr: |
            rate(node_pressure_io_waiting_seconds_total[5m]) > 0.5
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.kubernetes_node }} IO-waiting {{ $value | humanizePercentage }} of the time"
            description: >-
              At least one task on {{ $labels.kubernetes_node }} has been blocked on IO
              for {{ $value | humanizePercentage }} of wall-clock time, sustained over 1h.
              Distinguish local vs network storage: node_disk_* covers local sd/nvme only —
              PSI includes NFS and iSCSI waits. Slow-but-answering NFS servers show zero
              RPC retransmissions; check per-device latency and 'ps -eLo stat,comm' for D.

        # PSI io "full" — fraction of time *all* runnable tasks are blocked on IO.
        # Caveat learned 2026-11: on near-idle nodes PSI "full" is inflated by math
        # (denominator = currently non-idle tasks), e.g. 70% PSI with only 20% real
        # CPU iowait — so the critical tier requires an iowait corroborator, and the
        # unconfirmed case demotes to the informational one below.
        - alert: NodeIOPressureStalled
          expr: |
            rate(node_pressure_io_stalled_seconds_total[5m]) > 0.3
            and on (kubernetes_node)
            avg by (kubernetes_node) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 0.10
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.kubernetes_node }} severely IO-stalled (PSI full {{ $value | humanizePercentage }}, iowait corroborated)"
            description: >-
              All runnable tasks on {{ $labels.kubernetes_node }} were IO-blocked for
              {{ $value | humanizePercentage }} of wall-clock time for 1h, AND CPU iowait
              exceeds 10% of capacity — the stall is real, not idle-node PSI inflation.
              Triage: ps -eLo stat,wchan:24,comm | awk '$1 ~ /D/' on the node; check
              NFS mounts (slow-but-answering servers produce *zero* retransmissions),
              Longhorn iSCSI session churn (dmesg resets), and disk latencies.

        # Same PSI signal WITHOUT iowait corroboration: most likely the idle-node
        # inflation artifact or rare micro-stalls — informational only (muted to Pushover).
        - alert: NodeIOPressureStalledSuspected
          expr: |
            rate(node_pressure_io_stalled_seconds_total[5m]) > 0.3
            and on (kubernetes_node)
            avg by (kubernetes_node) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) <= 0.10
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "Node {{ $labels.kubernetes_node }} reports high IO full-stall without iowait backing"
            description: >-
              PSI full io >30% for 1h but CPU iowait stays low (<10%). Usually the
              idle-node PSI inflation artifact on master-class nodes. If real work
              complains (slow image pulls, pod stalls), triage with ps -eLo on-node.

    - name: pod.disk.writes
      rules:
        # Catch pods writing unexpectedly heavy traffic to disk — usually misbehaving
        # apps that don't use tmpfs for /tmp, runaway logging, or unintended data churn.
        # Naturally heavy writers (databases, registries, time-series, video) are excluded
        # below. Threshold tuned so 2 MB/s sustained over 30 min triggers — that's
        # ~170 GB/day, far above what a typical web app should produce.
        - alert: PodHighDiskWriteRate
          expr: |
            sum by (namespace, pod) (
              rate(container_fs_writes_bytes_total{
                container!="",
                container!="POD",
                pod!~"(harbor-registry|harbor-jobservice|harbor-trivy|frigate|vmsingle|victoria-logs|mariadb|postgres|postgis|dragonfly|nextcloud|plex|jellyfin|immich|paperless|instance-manager|engine-image)-.*",
                namespace!="longhorn-system",
              }[10m])
            ) > 2 * 1024 * 1024
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} writing {{ $value | humanize }}B/s to disk"
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} has been writing {{ $value | humanize }}B/s
              ({{ $value | humanize1024 }}/s) to disk for 30 minutes. This is unusual for a non-storage
              workload and usually indicates: missing tmpfs mount for /tmp, runaway logging, or unbounded
              cache/state writes. Check container io.stat and consider mounting ephemeral paths as emptyDir
              with medium=Memory.
