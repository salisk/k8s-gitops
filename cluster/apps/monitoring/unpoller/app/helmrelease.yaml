---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: victoria-metrics
  values:
    controllers:
      unpoller:
        containers:
          app:
            image:
              repository: ghcr.io/unpoller/unpoller
              tag: v3.3.4@sha256:6cd108c731a4f5896d008982ba53b398a5510421d4ef67ce2218aa61d6d2cf8d
            env:
              TZ: "${TIMEZONE}"
              UP_PROMETHEUS_HTTP_LISTEN: 0.0.0.0:80
              UP_INFLUXDB_DISABLE: true
              # Controller 0
              UP_UNIFI_CONTROLLER_0_ROLE: k8s-gitops
              UP_UNIFI_CONTROLLER_0_URL: https://${GATEWAY_ADDR}
              UP_UNIFI_CONTROLLER_0_API_KEY: ${UNIFI_API_KEY}
              # Controller 1
              UP_UNIFI_CONTROLLER_1_URL: https://${GATEWAY_ADDR_2}
              UP_UNIFI_CONTROLLER_1_API_KEY: ${UNIFI_API_KEY_2}
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        controller: unpoller
        ports:
          http:
            port: 80
    serviceMonitor:
      app:
        serviceName: unpoller
        endpoints:
          - port: http
            interval: 2m # Unifi API only polls at 2m intervals
            scrapeTimeout: 10s
