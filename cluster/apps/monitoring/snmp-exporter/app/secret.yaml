---
apiVersion: v1
kind: Secret
metadata:
  name: snmp-exporter-secret
  namespace: monitoring
type: Opaque
stringData:
  auth.yml: |
    auths:
      synology_v3:
        version: 3
        security_level: authPriv
        auth_protocol: SHA
        priv_protocol: AES
        username: |-
          ${SNMP_SYNOLOGY_USERNAME}
        password: |-
          ${SNMP_SYNOLOGY_AUTH_PASSWORD}
        priv_password: |-
          ${SNMP_SYNOLOGY_PRIV_PASSWORD}
