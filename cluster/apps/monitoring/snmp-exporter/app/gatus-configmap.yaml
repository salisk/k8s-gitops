---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-gatus-ep
  namespace: monitoring
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: snmp-exporter
        group: internal
        url: "http://snmp-exporter.monitoring.svc.cluster.local:9116/-/healthy"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover
