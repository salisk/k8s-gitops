---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${APP}-gatus-ep"
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: "${APP}"
        group: internal
        url: "http://divegrade.media.svc.cluster.local:8080/healthz"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover
