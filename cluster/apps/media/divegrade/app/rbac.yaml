---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: divegrade-dispatcher
  namespace: media
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: divegrade-dispatcher
  namespace: media
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: divegrade-dispatcher
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: divegrade-dispatcher
subjects:
  - kind: ServiceAccount
    name: divegrade-dispatcher
    namespace: media
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: divegrade-worker
  namespace: media
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: divegrade-worker
  namespace: media
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: divegrade-worker
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: divegrade-worker
subjects:
  - kind: ServiceAccount
    name: divegrade-worker
    namespace: media
