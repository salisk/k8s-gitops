---
# Movies: low rated (TMDB < 5.5) AND already watched (>180d ago)
# Sections are OR-combined; rules within a section are AND-combined.
mediaType: MOVIE
rules:
  - "0":
      - firstValue: Plex.rating_tmdb
        action: SMALLER
        customValue: {type: NUMBER, value: "5.5"}
      - firstValue: Plex.lastViewedAt
        action: BEFORE
        customValue: {type: custom_days, value: "180"}
