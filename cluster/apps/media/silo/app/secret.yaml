---
apiVersion: v1
kind: Secret
metadata:
  name: silo-secret
  namespace: media
type: Opaque
stringData:
  DATABASE_URL: "postgres://silo:${SILO_POSTGRES_PASSWORD}@postgres-rw.data.svc.cluster.local:5432/silo?sslmode=disable"
  SECRET_KEY: "${SILO_SECRET_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: silo-init-secret
  namespace: media
type: Opaque
stringData:
  INIT_POSTGRES_HOST: postgres-rw.data.svc.cluster.local
  INIT_POSTGRES_USER: silo
  INIT_POSTGRES_PASS: "${SILO_POSTGRES_PASSWORD}"
  INIT_POSTGRES_DBNAME: silo
  INIT_POSTGRES_SUPER_USER: "${POSTGRES_SUPER_USER}"
  INIT_POSTGRES_SUPER_PASS: "${POSTGRES_SUPER_PASS}"
