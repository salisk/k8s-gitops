---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      bambuddy:
        type: deployment
        replicas: 1
        strategy: Recreate
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom:
              - secretRef:
                  name: bambuddy-secret
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.3.1@sha256:3b63f6b02ab77075716a6295d6f8ca27b98283580753b911b3841dcd9972a110
            env:
              TZ: ${TIMEZONE}
              PORT: 8000
              BAMBU_STUDIO_API_URL: http://localhost:3001
              LOG_LEVEL: INFO
              APP_URL: "https://bambu.${SECRET_DOMAIN}"
              BAMBUDDY_OIDC_NAME: Authentik
              BAMBUDDY_OIDC_ISSUER_URL: "https://sso.${SECRET_DOMAIN}/application/o/bambuddy/"
              BAMBUDDY_OIDC_AUTO_CREATE_USERS: "true"
              BAMBUDDY_OIDC_REQUIRE_EMAIL_VERIFIED: "true"
              BAMBUDDY_OIDC_AUTO_LINK_EXISTING: "true"
            envFrom:
              - secretRef:
                  name: bambuddy-secret
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add: [NET_BIND_SERVICE]
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
          slicer:
            image:
              repository: ghcr.io/maziggy/bambu-studio-api
              # Pin 1.3.0: 1.3.1 reportedly regresses extracted-directory permissions for non-root users.
              tag: bambuddy-1.3.0@sha256:36d16b7c723be10b823deb0e60b5c827eed2b6fd7ea75e4570445439e55f96fe
            env:
              NODE_ENV: production
              PORT: 3001
              HOME: /tmp
              MAX_MODEL_UPLOAD_MB: "512"
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3001
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3001
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3001
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      annotations:
        secret.reloader.stakater.com/reload: bambuddy-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: bambuddy
        ports:
          http:
            port: 8000
            appProtocol: kubernetes.io/ws
    serviceMonitor:
      app:
        serviceName: bambuddy
        endpoints:
          - port: http
            scheme: http
            path: /api/v1/metrics
            interval: 30s
            scrapeTimeout: 10s
    route:
      app:
        hostnames:
          - bambu.${SECRET_DOMAIN}
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8000
    persistence:
      config:
        existingClaim: bambuddy-config-v1
        advancedMounts:
          bambuddy:
            app:
              - path: /app/data
      slicer-data:
        type: emptyDir
        sizeLimit: 10Gi
        advancedMounts:
          bambuddy:
            slicer:
              - path: /app/data
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
