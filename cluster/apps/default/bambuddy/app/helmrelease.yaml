---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      bambuddy:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.2.5.7@sha256:807f67511fa8c2b644b09de50a5d41794372214d00bd04fda59f576d9958d280
            env:
              TZ: ${TIMEZONE}
              PORT: 8000
              LOG_LEVEL: INFO
              BAMBUDDY_OIDC_NAME: Authentik
              BAMBUDDY_OIDC_ISSUER_URL: "https://sso.${SECRET_DOMAIN}/application/o/bambuddy/"
              BAMBUDDY_OIDC_SCOPES: "openid email profile"
              BAMBUDDY_OIDC_ENABLED: "true"
              BAMBUDDY_OIDC_AUTO_CREATE_USERS: "true"
              BAMBUDDY_OIDC_AUTO_LINK_EXISTING: "false"
              BAMBUDDY_OIDC_EMAIL_CLAIM: email
              BAMBUDDY_OIDC_REQUIRE_EMAIL_VERIFIED: "true"
              BAMBUDDY_OIDC_DEFAULT_GROUP: Viewers
              BAMBUDDY_OIDC_AUTOLOGIN: "false"
              BAMBUDDY_LOCAL_LOGIN: "true"
            envFrom:
              - secretRef:
                  name: bambuddy-secret
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add: [NET_BIND_SERVICE]
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      annotations:
        secret.reloader.stakater.com/reload: bambuddy-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: bambuddy
        ports:
          http:
            port: 8000
            appProtocol: kubernetes.io/ws
    route:
      app:
        hostnames:
          - bambu.${SECRET_DOMAIN}
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8000
    persistence:
      config:
        existingClaim: bambuddy-config-v1
        globalMounts:
          - path: /app/data
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
