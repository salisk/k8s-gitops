---
apiVersion: v1
kind: Secret
metadata:
  name: bambuddy-secret
  namespace: default
type: Opaque
stringData:
  INIT_POSTGRES_DBNAME: bambuddy
  INIT_POSTGRES_HOST: postgres-rw.data.svc.cluster.local
  INIT_POSTGRES_USER: bambuddy
  INIT_POSTGRES_PASS: "${BAMBUDDY_POSTGRES_PASSWORD}"
  INIT_POSTGRES_SUPER_PASS: "${POSTGRES_SUPER_PASS}"
  DATABASE_URL: "postgresql+asyncpg://bambuddy:${BAMBUDDY_POSTGRES_PASSWORD}@postgres-rw.data.svc.cluster.local:5432/bambuddy"
  BAMBUDDY_OIDC_CLIENT_ID: "${BAMBUDDY_OIDC_CLIENT_ID}"
  BAMBUDDY_OIDC_CLIENT_SECRET: "${BAMBUDDY_OIDC_CLIENT_SECRET}"
