---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            # runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 33
              - 1000
        containers:
          app:
            image:
              repository: opencloudeu/opencloud-rolling
              tag: 7.4.0@sha256:e9df43040866c3587daae47af68bc3c412026bc99614686bf6869bdc72c52526
            command:
              [
                "/bin/sh",
                "-c",
                "opencloud init || true; opencloud server",
              ]
            env:
              OC_INSECURE: true
              OC_URL: https://cloud.${SECRET_DOMAIN}
              OC_EXCLUDE_RUN_SERVICES: idp

              PROXY_TLS: false
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
              PROXY_USER_OIDC_CLAIM: "preferred_username"
              PROXY_USER_CS3_CLAIM: "username"
              PROXY_AUTOPROVISION_ACCOUNTS: "true"
              PROXY_ROLE_ASSIGNMENT_DRIVER: "oidc"
              PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: "none"
              PROXY_OIDC_REWRITE_WELLKNOWN: "true"
              PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: "groups"
              PROXY_AUTOPROVISION_CLAIM_USERNAME: "preferred_username"
              IDM_ADMIN_PASSWORD: "${OPENCLOUD_IDM_PASSWORD}"

              GATEWAY_GRPC_ADDR: 0.0.0.0:9142
              OC_ENABLE_OCM: false

              # Collabora integration
              FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR: eu.opencloud.api.collaboration.CollaboraOnline
              NATS_NATS_HOST: "0.0.0.0"

              OC_OIDC_ISSUER: https://sso.${SECRET_DOMAIN}/application/o/opencloud/
              WEB_OPTION_ACCOUNT_EDIT_LINK_HREF: "https://sso.${SECRET_DOMAIN}/ui/profile"
              WEB_OIDC_CLIENT_ID: *app
              WEB_OIDC_SCOPE: "openid profile email groups"

              OC_ADMIN_USER_ID: ""
              SETTINGS_SETUP_DEFAULT_ASSIGNMENTS: "false"
              GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
              GRAPH_USERNAME_MATCH: "none"

              # S3
              STORAGE_USERS_DRIVER: "decomposed"
              DECOMPOSEDS3_ENDPOINT: "http://minio.default.svc:9000"
              DECOMPOSEDS3_REGION: "eu-east-1"
              DECOMPOSEDS3_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
              DECOMPOSEDS3_SECRET_KEY: "${MINIO_SECRET_KEY}"
              DECOMPOSEDS3_BUCKET: opencloud
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      wopi:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          wopi:
            image:
              repository: opencloudeu/opencloud-rolling
              tag: 7.4.0@sha256:e9df43040866c3587daae47af68bc3c412026bc99614686bf6869bdc72c52526
            command: ["/bin/sh", "-c", "opencloud collaboration server"]
            env:
              COLLABORATION_WOPI_SRC: http://opencloud-wopi:9300
              COLLABORATION_APP_NAME: CollaboraOnline
              COLLABORATION_APP_PRODUCT: Collabora
              COLLABORATION_APP_ADDR: https://collabora.${SECRET_DOMAIN}
              COLLABORATION_APP_ICON: https://collabora.${SECRET_DOMAIN}/favicon.ico
              COLLABORATION_APP_INSECURE: true
              COLLABORATION_APP_PROOF_DISABLE: true
              COLLABORATION_CS3API_DATAGATEWAY_INSECURE: true
              COLLABORATION_GRPC_ADDR: 0.0.0.0:9301
              COLLABORATION_HTTP_ADDR: 0.0.0.0:9300
              MICRO_REGISTRY: nats-js-kv
              MICRO_REGISTRY_ADDRESS: opencloud.data.svc.cluster.local:9233
              OC_CACHE_STORE: nats-js-kv
              OC_CACHE_STORE_NODES: opencloud.data.svc.cluster.local:9233
              OC_PERSISTENT_STORE: nats-js-kv
              OC_PERSISTENT_STORE_NODES: opencloud.data.svc.cluster.local:9233
              OC_EVENTS_ENDPOINT: opencloud.data.svc.cluster.local:9233
              OC_EVENTS_CLUSTER: opencloud-cluster
              OC_URL: https://cloud.${SECRET_DOMAIN}
              OC_SERVICE_ACCOUNT_ID: "${OPENCLOUD_SERVICE_ACCOUNT_ID}"
              OC_SERVICE_ACCOUNT_SECRET: "${OPENCLOUD_SERVICE_ACCOUNT_SECRET}"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: opencloud
        forceRename: opencloud
        ports:
          http:
            port: 80
            targetPort: 9200
          nats:
            port: 9233
            targetPort: 9233
      wopi:
        controller: wopi
        ports:
          http:
            port: 9300
            targetPort: 9300
          grpc:
            port: 9301
            targetPort: 9301
    route:
      app:
        hostnames: ["cloud.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80
      wopi:
        hostnames: ["wopi.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: wopi
                port: 9300

    persistence:
      config:
        type: configMap
        name: opencloud-configmap
        globalMounts:
          - path: /etc/opencloud/csp.yaml
            subPath: csp.yaml
          - path: /etc/opencloud/proxy.yaml
            subPath: proxy.yaml
      data:
        existingClaim: nfs-opencloud-v1
        advancedMounts:
          opencloud:
            app:
              - path: /var/lib/opencloud
                subPath: data
              - path: /etc/opencloud
                subPath: config
          wopi:
            wopi:
              - path: /etc/opencloud
                subPath: config
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
