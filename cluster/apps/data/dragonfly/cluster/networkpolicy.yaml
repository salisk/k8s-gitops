---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-metrics
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  ingress:
    - from:
        - podSelector: {}
          namespaceSelector: {}
      ports:
        - port: 6379
          protocol: TCP
    # Admin port — used by operator for replica configuration and vmagent for metrics.
    # Cilium doesn't enforce the namespaceSelector+podSelector combination correctly,
    # so we allow all ingress on this port (same as 6379 above).
    - from:
        - podSelector: {}
          namespaceSelector: {}
      ports:
        - port: 9999
          protocol: TCP
  policyTypes:
    - Ingress
